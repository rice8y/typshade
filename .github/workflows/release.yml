name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create distribution folder
        shell: bash
        run: |
          mkdir -p dist/typshade
          cp -R package/. dist/typshade/

      - name: Compress package
        shell: bash
        run: |
          cd dist
          zip -r "../typshade-${{ github.ref_name }}.zip" typshade

      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/generate-release-notes.py \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --output release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: typshade-${{ github.ref_name }}.zip
          body_path: release-notes.md
